name: Live public CRUD validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-crud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build PostgreSQL 18 image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: PG_MAJOR=18
          load: true
          tags: openapi-fdw:live-crud-pg18
          cache-from: type=gha,scope=pg18
          cache-to: type=gha,mode=max,scope=pg18
      - name: Start PostgreSQL
        run: |
          docker run --detach \
            --name openapi-fdw-live-crud \
            --tmpfs /var/lib/postgresql:rw,size=512m \
            --env POSTGRES_PASSWORD=postgres \
            --volume "$GITHUB_WORKSPACE/tests:/tests:ro" \
            openapi-fdw:live-crud-pg18
          ready_checks=0
          for attempt in $(seq 1 60); do
            if docker exec openapi-fdw-live-crud pg_isready -U postgres; then
              ready_checks=$((ready_checks + 1))
              if [ "$ready_checks" -ge 3 ]; then break; fi
            else
              ready_checks=0
            fi
            sleep 1
          done
          test "$ready_checks" -ge 3
      - name: Create one disposable public object
        env:
          API_ORIGIN: https://api.restful-api.dev
        run: |
          marker="openapi-fdw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          response=$(curl --fail --silent --show-error \
            --request POST \
            --header 'content-type: application/json' \
            --data "{\"name\":\"$marker\",\"data\":{\"stage\":\"bootstrap\"}}" \
            "$API_ORIGIN/objects")
          object_id=$(printf '%s' "$response" | jq --raw-output '.id // empty')
          test -n "$object_id"
          printf 'OBJECT_ID=%s\n' "$object_id" >> "$GITHUB_ENV"
      - name: Import the OpenAPI contract and mutate through SQL
        run: |
          docker exec openapi-fdw-live-crud \
            psql -X -v ON_ERROR_STOP=1 \
              -v object_id="$OBJECT_ID" \
              -U postgres -d postgres \
              -f /tests/sql/live_crud.sql
      - name: Cleanup disposable public object
        if: always()
        env:
          API_ORIGIN: https://api.restful-api.dev
        run: |
          test -n "${OBJECT_ID:-}" || exit 0
          status=$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --request DELETE \
            "$API_ORIGIN/objects/$OBJECT_ID")
          test "$status" = 200 || test "$status" = 404
      - name: Diagnostics
        if: failure()
        run: docker logs --tail 200 openapi-fdw-live-crud || true
      - name: Remove test container
        if: always()
        run: docker rm --force --volumes openapi-fdw-live-crud || true
