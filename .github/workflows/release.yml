name: Release images and native packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  postgres-image:
    name: PostgreSQL ${{ matrix.pg }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish slim Alpine image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            PG_MAJOR=${{ matrix.pg }}
            POSTGRES_VARIANT=alpine
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-pg${{ matrix.pg }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-pg${{ matrix.pg }}-alpine
            ghcr.io/${{ github.repository }}:pg${{ matrix.pg }}
            ghcr.io/${{ github.repository }}:pg${{ matrix.pg }}-alpine
          cache-from: type=gha,scope=pg${{ matrix.pg }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg }}

  native-package:
    name: PostgreSQL ${{ matrix.pg }} native package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Export glibc extension package
        uses: docker/build-push-action@v7
        with:
          context: .
          target: extension-package
          build-args: |
            PG_MAJOR=${{ matrix.pg }}
            POSTGRES_VARIANT=bookworm
          outputs: type=local,dest=/tmp/openapi-fdw-package
          cache-from: type=gha,scope=pg${{ matrix.pg }}-bookworm
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg }}-bookworm
      - name: Create portable archive
        env:
          PG_MAJOR: ${{ matrix.pg }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/release
          cp "$(find /tmp/openapi-fdw-package -type f -name openapi_fdw.so -print -quit)" /tmp/release/
          cp "$(find /tmp/openapi-fdw-package -type f -name openapi_fdw.control -print -quit)" /tmp/release/
          cp "$(find /tmp/openapi-fdw-package -type f -name 'openapi_fdw--*.sql' -print -quit)" /tmp/release/
          archive="openapi_fdw-${VERSION}-pg${PG_MAJOR}-linux-amd64.tar.gz"
          tar -C /tmp/release -czf "$archive" .
          sha256sum "$archive" >"$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: native-pg${{ matrix.pg }}
          path: |
            openapi_fdw-*.tar.gz
            openapi_fdw-*.tar.gz.sha256
          if-no-files-found: error

  control-image:
    name: Control-plane image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish control plane
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.control
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-control
            ghcr.io/${{ github.repository }}:control
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane

  github-release:
    name: GitHub release
    needs: [postgres-image, native-package, control-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: native-pg*
          merge-multiple: true
          path: release-assets
      - name: Publish checksummed native packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "OpenAPI FDW $GITHUB_REF_NAME" \
            release-assets/*
