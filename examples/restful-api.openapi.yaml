openapi: 3.1.0
info:
  title: RESTful API.dev public objects
  version: 1.0.0
  description: >-
    A compact OpenAPI contract for the unauthenticated public object API
    documented at https://restful-api.dev/. The service is intended for tests
    and demonstrations and currently limits public clients to 50 requests per
    day.
servers:
  - url: https://api.restful-api.dev
paths:
  /objects:
    get:
      operationId: listObjects
      summary: List public objects
      responses:
        "200":
          description: Objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Object"
    post:
      operationId: createObject
      summary: Create an object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObject"
      responses:
        "200":
          description: Created object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /objects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getObject
      summary: Fetch one object
      responses:
        "200":
          description: Object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "404":
          description: Not found
    put:
      operationId: replaceObject
      summary: Replace an object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObject"
      responses:
        "200":
          description: Replaced object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
    patch:
      operationId: updateObject
      summary: Update selected object fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateObject"
      responses:
        "200":
          description: Updated object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
    delete:
      operationId: deleteObject
      summary: Delete an object
      responses:
        "200":
          description: Deletion confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
components:
  schemas:
    Object:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        data:
          type: [object, "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    CreateObject:
      type: object
      required: [name, data]
      properties:
        name:
          type: string
        data:
          type: object
          additionalProperties: true
    UpdateObject:
      type: object
      properties:
        name:
          type: string
        data:
          type: object
          additionalProperties: true
