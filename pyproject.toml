[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-fdw"
version = "0.1.0"
description = "PostgreSQL Multicorn FDW for BrasilAPI endpoints"
readme = "README.md"
authors = [{ name = "sabino", email = "982190+sabino@users.noreply.github.com" }]
license = { text = "WTFPL" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "hy>=1.0",
]
classifiers = [
    "License :: Public Domain",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Front-Ends",
]

[project.optional-dependencies]
dev = [
    "psycopg2-binary",
    "pytest",
]

[tool.uv]
managed = true
